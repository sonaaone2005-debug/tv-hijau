<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TV Biru – Video Pembelajaran</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Arial,sans-serif}body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}.tv-area{width:100%;max-width:1000px;padding:18px 12px 22px;display:flex;flex-direction:column;align-items:center}.tv{width:100%;padding:17px 18px 35px;position:relative;background:linear-gradient(145deg,#428bbe 0%,#236393 42%,#123f6c 100%);border:7px solid #0a3155;border-radius:34px;box-shadow:inset 5px 5px 0 #83c5ea,inset -5px -7px 0 #092d51,0 13px 0 #092c4b,0 19px 22px #0003}.screen{width:100%;aspect-ratio:16/9;padding:6px;background:#071e36;border:5px solid #092c4d;border-radius:19px;overflow:hidden;box-shadow:inset 0 0 12px #000,0 0 0 3px #69b3df}.screen iframe{display:block;width:100%;height:100%;border:0;border-radius:9px;background:#000}.controls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px}.light{width:9px;height:9px;border-radius:50%;background:#a6f3cb;box-shadow:0 0 8px #a6f3cb}.speaker{display:flex;gap:4px}.speaker i{display:block;width:4px;height:9px;border-radius:3px;background:#91c8e8}.neck{width:15%;height:18px;margin-top:10px;background:linear-gradient(90deg,#0b3155,#3279aa,#0b3155);border-radius:0 0 5px 5px}.base{width:37%;height:16px;background:linear-gradient(#397fb0,#103d68);border:3px solid #092d4f;border-radius:50% 50% 12px 12px;box-shadow:0 5px 7px #0003}@media(max-width:600px){.tv-area{padding:12px 8px 20px}.tv{padding:9px 10px 26px;border-width:4px;border-radius:20px}.screen{padding:3px;border-width:3px;border-radius:10px}.screen iframe{border-radius:5px}.controls{bottom:7px}.neck{height:12px;margin-top:7px}.base{height:12px}}
</style>
</head>
<body>
<div class="tv-area">
  <div class="tv">
    <div class="screen">
      <iframe src="https://www.youtube.com/embed/r8n5afU_deE?playsinline=1&amp;rel=0" title="Video Pembelajaran" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
    <div class="controls"><div class="light"></div><div class="speaker"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <div class="neck"></div><div class="base"></div>
</div>
</body>
</html>
